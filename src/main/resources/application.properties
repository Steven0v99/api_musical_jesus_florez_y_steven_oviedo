# Configuración de la base de datos MySQL usando variables de entorno
spring.sql.init.mode=always
###
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:signos_music_db}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuración de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Actuator y Prometheus (Requerido para Puntos 4 y 5)
management.endpoints.web.exposure.include=health,metrics,prometheus

# Mostrar detalles completos en el indicador de salud (/actuator/health)
management.endpoint.health.show-details=always

# =========================
# SPRING BOOT ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

server.port=8080